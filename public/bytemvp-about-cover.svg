<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ByteMVP minimal cover</title>
  <desc id="desc">A minimal pastel ByteMVP brand cover with a simple card, small AI nodes, and soft geometric shapes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#f3fbf7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#537367" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="206" cy="155" r="96" fill="#d7edc3" opacity="0.72"/>
  <circle cx="1010" cy="500" r="124" fill="#d4c9f0" opacity="0.38"/>
  <circle cx="910" cy="154" r="56" fill="#f6c7d6" opacity="0.5"/>

  <g transform="translate(215 150)" filter="url(#shadow)">
    <rect width="770" height="360" rx="44" fill="url(#card)" stroke="#2c3642" stroke-opacity="0.08"/>
    <rect x="58" y="58" width="86" height="86" rx="24" fill="#6fa7a0"/>
    <path d="M82 103h38M101 84v38" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>

    <text x="58" y="214" fill="#2c3642" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="950" letter-spacing="-2">ByteMVP</text>
    <text x="62" y="264" fill="#4d7772" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">AI INSIGHTS ? MVP THINKING</text>

    <g transform="translate(566 88)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="72" cy="72" r="48" fill="#bfe5ea" stroke="#6fa7a0" stroke-width="4"/>
      <circle cx="72" cy="72" r="14" fill="#2c3642" stroke="none"/>
      <path d="M72 24v-28M72 148v-28M24 72h-28M148 72h-28M38 38L18 18M106 106l20 20M106 38l20-20M38 106l-20 20" stroke="#6fa7a0" stroke-width="5"/>
      <g fill="#6fa7a0" stroke="none">
        <circle cx="72" cy="-4" r="7"/><circle cx="72" cy="148" r="7"/><circle cx="-4" cy="72" r="7"/><circle cx="148" cy="72" r="7"/><circle cx="18" cy="18" r="6"/><circle cx="126" cy="126" r="6"/><circle cx="126" cy="18" r="6"/><circle cx="18" cy="126" r="6"/>
      </g>
    </g>
  </g>

  <path d="M96 562C260 494 350 590 500 524S706 438 854 482" fill="none" stroke="#6fa7a0" stroke-width="5" stroke-linecap="round" opacity="0.28"/>
  <path d="M718 582h210" stroke="#f7d99b" stroke-width="14" stroke-linecap="round" opacity="0.76"/>
</svg>
