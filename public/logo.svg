<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 256" role="img" aria-label="Byte MVP pixel logo">
	<title>Byte MVP</title>
	<!-- pure white background -->
	<rect width="420" height="256" fill="#ffffff"/>

	<defs>
		<!-- one pixel block, crisp edges -->
		<rect id="px" width="16" height="16"/>
	</defs>

	<!-- B : dark ink, 7 rows -->
	<g fill="#1c262b">
		<use href="#px" x="32" y="56"/><use href="#px" x="48" y="56"/><use href="#px" x="64" y="56"/><use href="#px" x="80" y="56"/>
		<use href="#px" x="32" y="72"/><use href="#px" x="96" y="72"/>
		<use href="#px" x="32" y="88"/><use href="#px" x="96" y="88"/>
		<use href="#px" x="32" y="104"/><use href="#px" x="48" y="104"/><use href="#px" x="64" y="104"/><use href="#px" x="80" y="104"/>
		<use href="#px" x="32" y="120"/><use href="#px" x="96" y="120"/>
		<use href="#px" x="32" y="136"/><use href="#px" x="96" y="136"/>
		<use href="#px" x="32" y="152"/><use href="#px" x="48" y="152"/><use href="#px" x="64" y="152"/><use href="#px" x="80" y="152"/>
	</g>

	<!-- shared vertical pixel line between B and MVP : half ink, half gray -->
	<use href="#px" x="112" y="56" fill="#1c262b"/><use href="#px" x="112" y="72" fill="#1c262b"/><use href="#px" x="112" y="88" fill="#1c262b"/>
	<use href="#px" x="112" y="104" fill="#55616a"/><use href="#px" x="112" y="120" fill="#55616a"/><use href="#px" x="112" y="136" fill="#55616a"/>
	<use href="#px" x="112" y="152" fill="#1c262b"/>

	<!-- MVP : medium gray -->
	<g fill="#55616a">
		<!-- M -->
		<use href="#px" x="128" y="72"/><use href="#px" x="176" y="72"/>
		<use href="#px" x="128" y="88"/><use href="#px" x="144" y="88"/><use href="#px" x="160" y="88"/><use href="#px" x="176" y="88"/>
		<use href="#px" x="128" y="104"/><use href="#px" x="152" y="104"/><use href="#px" x="176" y="104"/>
		<use href="#px" x="128" y="120"/><use href="#px" x="176" y="120"/>
		<use href="#px" x="128" y="136"/><use href="#px" x="176" y="136"/>

		<!-- V -->
		<use href="#px" x="192" y="72"/><use href="#px" x="240" y="72"/>
		<use href="#px" x="192" y="88"/><use href="#px" x="240" y="88"/>
		<use href="#px" x="192" y="104"/><use href="#px" x="240" y="104"/>
		<use href="#px" x="208" y="120"/><use href="#px" x="224" y="120"/>
		<use href="#px" x="216" y="136"/>

		<!-- P (final bottom pixel intentionally missing) -->
		<use href="#px" x="256" y="72"/><use href="#px" x="272" y="72"/><use href="#px" x="288" y="72"/><use href="#px" x="304" y="72"/>
		<use href="#px" x="256" y="88"/><use href="#px" x="304" y="88"/>
		<use href="#px" x="256" y="104"/><use href="#px" x="272" y="104"/><use href="#px" x="288" y="104"/><use href="#px" x="304" y="104"/>
		<use href="#px" x="256" y="120"/>
		<use href="#px" x="256" y="136"/>
		<!-- row y=152 under P: deliberately empty -->
	</g>

	<!-- micro "MVP" carved out of the B middle stroke (knockout) -->
	<text x="37" y="115.5" font-family="'Courier New', monospace" font-size="12" font-weight="bold" letter-spacing="1.5" fill="#ffffff">MVP</text>

	<!-- tiny pixel crown floating above the M (M center x = 158) -->
	<g fill="#00e5d0">
		<rect x="138" y="20" width="8" height="8"/>
		<rect x="170" y="20" width="8" height="8"/>
		<rect x="138" y="28" width="8" height="8"/>
		<rect x="146" y="28" width="8" height="8"/>
		<rect x="154" y="28" width="8" height="8"/>
		<rect x="162" y="28" width="8" height="8"/>
		<rect x="170" y="28" width="8" height="8"/>
	</g>

	<!-- glitch: one displaced letter slice + displaced scanlines crossing MVP -->
	<rect x="136" y="76" width="40" height="6" fill="#00e5d0" opacity="0.55" transform="translate(10 0)"/>
	<rect x="122" y="98" width="198" height="4" fill="#00e5d0" opacity="0.7" transform="translate(8 0)"/>
	<rect x="122" y="126" width="198" height="4" fill="#94a3ad" opacity="0.5" transform="translate(-11 0)"/>
	<rect x="126" y="158" width="194" height="4" fill="#00e5d0" opacity="0.35" transform="translate(13 0)"/>

	<!-- three pixel dots, triangle arrangement, different sizes -->
	<rect x="346" y="32" width="18" height="18" fill="#00e5d0"/>
	<rect x="44" y="196" width="26" height="26" fill="#2a363a"/>
	<rect x="354" y="184" width="12" height="12" fill="#b9c4ca"/>
</svg>
